{% extends "base.html" %}

{% block title %}Browse cards · CardSwap{% endblock %}

{% block content %}
<section>
  <h1 class="page-title">Browse</h1>

  <a href="{{ url_for('search') }}" class="searchbar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Search cards
  </a>

  {% for card in cards %}
    {% include "_listing.html" %}
  {% else %}
    <p class="empty">No cards posted yet.</p>
  {% endfor %}
</section>
{% endblock %}
