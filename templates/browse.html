{% extends "base.html" %}
{% block content %}
<h1>Browse Cards</h1>
{% for card in cards %}
  <a href="/card/{{ card._id }}" class="card">
    <h3>{{ card.brand }} - ${{ card.value }}</h3>
    <p>Wants: {{ card.wanted }}</p>
    <p class="small">Posted by {{ card.owner_username }}</p>
  </a>
{% else %}
  <p>No cards yet.</p>
{% endfor %}
{% endblock %}
