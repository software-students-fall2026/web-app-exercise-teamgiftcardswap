{% extends "base.html" %}
{% block content %}
<h1>Search</h1>
<form method="GET">
  <input type="text" name="brand" placeholder="Search by brand (ex. Starbucks)" value="{{ brand }}">
  <button type="submit">Search</button>
</form>

{% if brand %}
  {% for card in cards %}
    <a href="/card/{{ card._id }}" class="card">
      <h3>{{ card.brand }} - ${{ card.value }}</h3>
      <p>Wants: {{ card.wanted }}</p>
      <p class="small">Posted by {{ card.owner_username }}</p>
    </a>
  {% else %}
    <p>No cards found.</p>
  {% endfor %}
{% endif %}
{% endblock %}
