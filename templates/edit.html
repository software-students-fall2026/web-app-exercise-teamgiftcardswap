{% extends "base.html" %}
{% block content %}
<h1>Edit Card</h1>
<form method="POST">
  <label>Brand</label>
  <input type="text" name="brand" value="{{ card.brand }}" required>
  <label>Value ($)</label>
  <input type="number" name="value" step="0.01" min="0" value="{{ card.value }}" required>
  <label>Brands you want</label>
  <input type="text" name="wanted" value="{{ card.wanted }}" required>
  <label>Card number</label>
  <input type="text" name="code" value="{{ card.code }}" required>
  <button type="submit">Save</button>
</form>
<a href="/my-cards">Cancel</a>
{% endblock %}
