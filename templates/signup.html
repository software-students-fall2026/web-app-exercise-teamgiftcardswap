{% extends "base.html" %}

{% block title %}Sign up · CardSwap{% endblock %}

{% block content %}
<section class="auth">
  <h1>Create an account</h1>
  <form method="post" class="form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required>

    <button type="submit" class="btn btn-primary">Sign up</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
