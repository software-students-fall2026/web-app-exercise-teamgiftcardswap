<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CardSwap{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="logo">CardSwap</a>
    <nav class="topbar-nav">
      <a href="{{ url_for('browse') }}" class="topbar-link">Browse</a>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('my_listings') }}" class="topbar-link">My cards</a>
        <a href="{{ url_for('settings') }}" class="topbar-link">Settings</a>
      {% else %}
        <a href="{{ url_for('login') }}" class="topbar-link">Log in</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p class="flash">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
